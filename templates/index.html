<!DOCTYPE html>

<html>
<head>
    <title>Service Request</title>
</head>

<body>

    <h1>Request a Service</h1>

    <form method="POST">

        <label>Name:</label>
        <br>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <br>
        <input type="email" name="email" required>

        <br><br>

        <label>Phone:</label>
        <br>
        <input type="text" name="phone" required>

        <br><br>

        <label>Service:</label>
        <br>
        <input type="text" name="service" required>

        <br><br>

        <button type="submit">
            Submit Request
        </button>

    </form>

</body>
</html>
